name: Build executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish assets to (e.g. v1.0.3)'
        required: false

permissions:
  contents: write

jobs:
  build-and-publish:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build app executable
        run: python scripts/build_executable.py

      - name: Package binary as zip
        run: python scripts/package_binary.py --runner-os "${{ runner.os }}"

      - name: Upload artifact for debugging
        uses: actions/upload-artifact@v4
        with:
          name: VaseGeneratorApp-${{ matrix.os }}
          path: |
            package/*.zip
            package/*.tar.gz
          if-no-files-found: error

      - name: Publish zip to GitHub Release Assets
        if: github.event_name == 'push' || github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
          files: |
            package/*.zip
            package/*.tar.gz
          append_body: true
          fail_on_unmatched_files: true
