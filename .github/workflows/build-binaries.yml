name: Build executables

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    if: startsWith(github.ref_name, 'v') || github.event_name == 'release'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build app executable
        run: python scripts/build_executable.py

      - name: Package binary as zip
        run: python scripts/package_binary.py --runner-os "${{ runner.os }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaseGeneratorApp-${{ matrix.os }}
          path: package/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref_name, 'v') || github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
          files: release-assets/**/*.zip
          generate_release_notes: true
