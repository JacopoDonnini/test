name: Build executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional release tag to publish assets to (e.g. v1.0.3). Leave empty to just build artifacts.'
        required: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      ref: ${{ steps.vars.outputs.ref }}
      publish: ${{ steps.vars.outputs.publish }}
    steps:
      - id: vars
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${{ github.ref_name }}"
            REF="${{ github.ref }}"
            PUBLISH="true"
          else
            TAG="${{ inputs.tag }}"
            REF="${{ github.ref }}"
            if [[ -n "$TAG" ]]; then
              REF="refs/tags/$TAG"
              PUBLISH="true"
            else
              PUBLISH="false"
            fi
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

          echo "Resolved ref: $REF"
          echo "Publish to release: $PUBLISH"
          if [[ "$PUBLISH" == "true" ]]; then
            echo "Release tag: $TAG"
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout ref
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.os == 'ubuntu-22.04' && '3.10' || '3.11' }}

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Linux diagnostics (glibc)
        if: runner.os == 'Linux'
        run: |
          ldd --version | head -n 1
          python --version

      - name: Build app executable
        run: python scripts/build_executable.py

      - name: Package binary archive
        run: python scripts/package_binary.py --runner-os "${{ runner.os }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaseGeneratorApp-${{ matrix.os }}
          path: |
            package/*.zip
            package/*.tar.gz
          if-no-files-found: error

  publish:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all built archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish archives to release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: release-assets/**/*
          append_body: true
          fail_on_unmatched_files: true
