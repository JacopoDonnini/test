name: Build executables

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build app executable
        run: python scripts/build_executable.py

      - name: Package binary as zip
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          dist = Path('dist')
          package = Path('package')
          package.mkdir(exist_ok=True)

          exe = dist / 'VaseGeneratorApp.exe'
          bin_unix = dist / 'VaseGeneratorApp'

          if exe.exists():
              target = exe
              name = 'VaseGeneratorApp-windows-latest.zip'
          elif bin_unix.exists():
              target = bin_unix
              # derive OS name from runner label via env if available
              import os
              runner = os.environ.get('RUNNER_OS', '').lower()
              if runner == 'linux':
                  name = 'VaseGeneratorApp-ubuntu-latest.zip'
              elif runner == 'macos':
                  name = 'VaseGeneratorApp-macos-latest.zip'
              else:
                  name = 'VaseGeneratorApp-unknown.zip'
          else:
              raise SystemExit('No built executable found in dist/')

          out = package / name
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as zf:
              zf.write(target, arcname=target.name)
          print(f'Created {out}')
          PY

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaseGeneratorApp-${{ matrix.os }}
          path: package/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*.zip
          generate_release_notes: true
