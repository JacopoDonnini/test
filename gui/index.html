<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Vase Generator GUI</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="layout">
    <aside class="panel">
      <h1>Parametric Vase GUI</h1>
      <p>Move sliders to morph the vase in real time.</p>

      <label>Preset
        <select id="preset"></select>
      </label>

      <div id="controls"></div>

      <div class="actions">
        <button id="resetBtn">Reset to preset</button>
        <button id="downloadBtn">Download OBJ</button>
      </div>
      <small>Top is open, bottom is closed.</small>
    </aside>

    <main>
      <canvas id="view"></canvas>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
